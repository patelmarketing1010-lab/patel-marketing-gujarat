<!doctype html>
<html lang="gu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Patel Marketing Gujarat | Be Local, Be Recognised</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {--navy:#06152d; --orange:#ff8a00; --orange2:#ffb13b; --paper:#f4f7fc; --ink:#12213a;}
        body {margin:0; font-family:Inter, 'Noto Sans Gujarati', sans-serif; color:var(--ink); background:var(--paper); padding:20px; line-height:1.6;}
        .wrap {max-width:600px; margin:40px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08);}
        h2 {color:var(--navy); margin-top:0;}
        .field {margin-bottom:15px;}
        label {display:block; margin-bottom:5px; font-weight:600; font-size:14px;}
        input, select, textarea {width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:14px; box-sizing:border-box;}
        button {background:linear-gradient(120deg, var(--orange), var(--orange2)); color:#101b2b; border:none; padding:14px 20px; font-weight:800; border-radius:8px; cursor:pointer; width:100%; font-size:15px;}
        button:hover {opacity:0.9;}
        #hint {margin-top:10px; color:#d9534f; font-size:13px; font-weight:600;}
    </style>
</head>
<body>
    <div class="wrap">
        <h2>PMG Inquiry Form</h2>
        <form id="leadForm">
            <div class="field">
                <label>તમારું નામ / Your Name</label>
                <input id="name" required placeholder="નામ લખો">
            </div>
            <div class="field">
                <label>બિઝનેસનું નામ / Business Name</label>
                <input id="business" placeholder="બિઝનેસનું નામ">
            </div>
            <div class="field">
                <label>મોબાઇલ નંબર / Phone Number</label>
                <input id="phone" required inputmode="tel" placeholder="મોબાઇલ નંબર">
            </div>
            <div class="field">
                <label>કઈ સર્વિસ જોઈએ? / Service Needed</label>
                <select id="interest" required>
                    <option value="">સર્વિસ પસંદ કરો</option>
                    <option>Digital Marketing</option>
                    <option>Local Marketing</option>
                    <option>Offline / Field Marketing</option>
                    <option>Branding & Design</option>
                </select>
            </div>
            <div class="field">
                <label>મેસેજ / Message</label>
                <textarea id="message" placeholder="તમારી જરૂરિયાત લખો"></textarea>
            </div>
            <button type="submit">WhatsApp પર ઇન્ક્વાયરી તૈયાર કરો ↗</button>
            <div id="hint"></div>
        </form>
    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.8net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // તમારો WhatsApp નંબર અહીં કંટ્રી કોડ સાથે નાખેલો છે
        const PMG_WHATSAPP_NUMBER = '917622900505';
        
        const SUPABASE_URL = "https://jqtqtbzxojlwzrkaogja.supabase.co";
        const SUPABASE_KEY = "sb_publishable_xLG4q1a44yKdy6xr4J5Uvg_HtvgzwbZ";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        document.getElementById('leadForm').addEventListener('submit', async e => {
            e.preventDefault();
            let n = PMG_WHATSAPP_NUMBER.replace(/\D/g, '');
            
            const v = id => document.getElementById(id).value.trim();
            
            const inquiryData = {
                name: v('name'),
                business: v('business') || 'Not provided',
                phone: v('phone'),
                service: v('interest'),
                message: v('message') || 'Please contact me.',
                created_at: new Date().toISOString()
            };

            // 1. ડેટાબેઝ (Admin Penal) માં સેવ કરો
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('inquiries').insert([inquiryData]);
                    if (error) {
                        console.error('Database error:', error);
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            }

            // 2. WhatsApp ઓપન કરો
            let msg = 'PMG business inquiry \n Name: ' + inquiryData.name + ' \n Business: ' + inquiryData.business + ' \n Phone: ' + inquiryData.phone + ' \n Service: ' + inquiryData.service + ' \n Message: ' + inquiryData.message;
            window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
        });
    </script>
</body>
</html>
