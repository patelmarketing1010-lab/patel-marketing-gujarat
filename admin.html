<!DOCTYPE html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMG Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#14213d}@media(prefers-color-scheme:dark){body{background:#0b1220;color:#eef2f8}}
nav{background:#0b1f3a;padding:10px;display:flex;gap:8px;flex-wrap:wrap}nav button{background:#f28c28;color:#fff;border:0;border-radius:8px;padding:8px 14px}
main{padding:14px;max-width:900px;margin:auto}.c{border:1px solid #8884;border-radius:10px;padding:10px;margin:8px 0}input,textarea,select{width:100%;padding:8px;margin:4px 0;font:inherit;border:1px solid #8886;border-radius:6px;background:transparent;color:inherit}
a{color:#f28c28}</style></head><body><nav id="nv" hidden>
<button onclick="tab('leads')">Leads</button><button onclick="tab('content')">Content</button><button onclick="tab('images')">Images</button><button onclick="tab('settings')">Settings</button><button onclick="sb.auth.signOut().then(()=>location.reload())">Logout</button></nav>
<main id="v"><h3>Admin Login</h3><input id="e" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button></main>
<script>
const sb=supabase.createClient("https://jqtqtbzxojlwzrkaogja.supabase.co","sb_publishable_xLG4q1a44yKdy6xr4J5Uvg_HtvgzwbZ");const $=s=>document.getElementById(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("e").value,password:$("pw").value});if(error){alert(error.message);return}const{data:userData,error:userErr}=await sb.auth.getUser();if(userErr||!userData.user){alert("Login ચકાસી શકાયું નથી");await sb.auth.signOut();return}const{data:admin,error:adminErr}=await sb.from("admin_users").select("user_id").eq("user_id",userData.user.id).maybeSingle();if(adminErr||!admin){alert("આ એકાઉન્ટ PMG Admin તરીકે મંજૂર નથી");await sb.auth.signOut();return}init()}
async function init(){const{data}=await sb.auth.getSession();if(data.session){$("nv").hidden=false;tab("leads")}}
async function tab(t){const v=$("v");
if(t=="leads"){const{data,error}=await sb.from("leads").select("*").order("created_at",{ascending:false});
if(error){v.innerHTML="<h3>Leads</h3><p>"+esc(error.message)+"</p>";return}
v.innerHTML="<h3>Leads ("+(data||[]).length+")</h3>"+((data||[]).length?(data||[]).map(l=>`<div class=c><b>${esc(l.name)}</b><br>${esc(l.need||"") }<br><a href="https://wa.me/91${esc(String(l.phone||"").replace(/\D/g,"").slice(-10))}" target=_blank rel=noopener>WhatsApp</a> · ${esc(l.phone)}<br><label>Status</label><select onchange="st('${esc(l.id)}',this.value)">${["New","Contacted","Follow-up","Converted","Closed"].map(s=>`<option value="${s}" ${l.status==s?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):"<p>હાલ કોઈ Lead નથી.</p>")}
if(t=="content"){const{data,error}=await sb.from("site_content").select("key,value").order("key");if(error){v.innerHTML="<h3>Content</h3><p>"+esc(error.message)+"</p>";return}v.innerHTML="<h3>Content</h3><p>દરેક key માટે એક value છે.</p>"+(data||[]).map(c=>`<div class=c><b>${esc(c.key)}</b><textarea id="val_${esc(c.key)}">${esc(c.value)}</textarea><button onclick="sc('${esc(c.key)}')">Save</button></div>`).join("")+`<div class=c><h4>નવું Content ઉમેરો</h4><input id=nk placeholder="key (ઉદાહરણ: service_title)"><textarea id=nv placeholder="value"></textarea><button onclick="sc($('nk').value,true)">Add Content</button></div>`}
if(t=="images"){const{data}=await sb.storage.from("images").list();v.innerHTML="<h3>Images</h3><input type=file id=fi><button onclick=up()>Upload</button>"+(data||[]).map(f=>{const u=sb.storage.from("images").getPublicUrl(f.name).data.publicUrl;return `<div class=c><a href="${u}" target=_blank>${esc(f.name)}</a></div>`}).join("")}
if(t=="settings"){const{data,error}=await sb.from("site_content").select("key,value").order("key");v.innerHTML="<h3>Settings / Website Values</h3><p>આ વિભાગ હાલની site_content ટેબલ વાપરે છે; નવી settings ટેબલની જરૂર નથી.</p>"+(error?"<p>"+esc(error.message)+"</p>":(data||[]).map(s=>`<div class=c><b>${esc(s.key)}</b><input id="s_${esc(s.key)}" value="${esc(s.value)}"><button onclick="ss('${esc(s.key)}')">Save</button></div>`).join(""))}}
async function st(id,s){const allowed=["New","Contacted","Follow-up","Converted","Closed"];if(!allowed.includes(s)){alert("અમાન્ય Status");return}const{error}=await sb.from("leads").update({status:s}).eq("id",id);if(error)alert("Status સાચવાયું નથી: "+error.message)}
async function sc(k,isNew=false){k=String(k||"").trim();if(!k){alert("Content key લખો");return}const el=$("val_"+k);const value=el?el.value:($("nv")?$("nv").value:"");const result=isNew?await sb.from("site_content").insert({key:k,value}):await sb.from("site_content").update({value}).eq("key",k);if(result.error){alert("Save થયું નથી: "+result.error.message);return}alert("Content સાચવાયું");tab("content")}
async function ss(k){const input=$("s_"+k);if(!input)return;const{error}=await sb.from("site_content").update({value:input.value}).eq("key",k);if(error){alert("Save થયું નથી: "+error.message);return}alert("Setting સાચવાઈ");tab("settings")}
async function up(){const f=$("fi").files[0];if(!f)return;const{error}=await sb.storage.from("images").upload(Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_"),f);error?alert(error.message):tab("images")}
init()</script></body></html>
