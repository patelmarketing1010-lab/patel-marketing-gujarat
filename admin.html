<!DOCTYPE html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMG Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#14213d}@media(prefers-color-scheme:dark){body{background:#0b1220;color:#eef2f8}}
nav{background:#0b1f3a;padding:10px;display:flex;gap:8px;flex-wrap:wrap}nav button{background:#f28c28;color:#fff;border:0;border-radius:8px;padding:8px 14px}
main{padding:14px;max-width:900px;margin:auto}.c{border:1px solid #8884;border-radius:10px;padding:10px;margin:8px 0}input,textarea,select{width:100%;padding:8px;margin:4px 0;font:inherit;border:1px solid #8886;border-radius:6px;background:transparent;color:inherit}
a{color:#f28c28}</style></head><body><nav id="nv" hidden>
<button onclick="tab('leads')">Leads</button><button onclick="tab('content')">Content</button><button onclick="tab('images')">Images</button><button onclick="tab('settings')">Settings</button><button onclick="sb.auth.signOut().then(()=>location.reload())">Logout</button></nav>
<main id="v"><h3>Admin Login</h3><input id="e" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button></main>
<script>
const sb=supabase.createClient("https://jqtqtbzxojlwzrkaogja.supabase.co","sb_publishable_xLG4q1a44yKdy6xr4J5Uvg_HtvgzwbZ");const $=s=>document.getElementById(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("e").value,password:$("pw").value});error?alert(error.message):init()}
async function init(){const{data}=await sb.auth.getSession();if(data.session){$("nv").hidden=false;tab("leads")}}
async function tab(t){const v=$("v");
if(t=="leads"){const{data}=await sb.from("leads").select("*").order("created_at",{ascending:false});
v.innerHTML="<h3>Leads ("+(data||[]).length+")</h3>"+(data||[]).map(l=>`<div class=c><b>${esc(l.name)}</b><br>${esc(l.need||[l.business,l.message].filter(Boolean).join(" | "))}<br><a href="https://wa.me/91${esc(String(l.phone||"").replace(/\D/g,"").slice(-10))}" target=_blank>WhatsApp</a> · ${esc(l.phone)}
<select onchange="st(${l.id},this.value)">${["New","Contacted","Follow-up","Won","Lost"].map(s=>`<option ${l.status==s?"selected":""}>${s}</option>`)}</select></div>`).join("")}
if(t=="content"){const{data}=await sb.from("site_content").select("*");v.innerHTML="<h3>Content</h3>"+(data||[]).map(c=>`<div class=c><b>${esc(c.key)}</b><textarea id="g_${esc(c.key)}">${esc(c.value_gu)}</textarea><textarea id="e_${esc(c.key)}">${esc(c.value_en)}</textarea><button onclick="sc('${esc(c.key)}')">Save</button></div>`).join("")+`<div class=c><input id=nk placeholder="new key"><button onclick="sc($('nk').value)">Add</button></div>`}
if(t=="images"){const{data}=await sb.storage.from("images").list();v.innerHTML="<h3>Images</h3><input type=file id=fi><button onclick=up()>Upload</button>"+(data||[]).map(f=>{const u=sb.storage.from("images").getPublicUrl(f.name).data.publicUrl;return `<div class=c><a href="${u}" target=_blank>${esc(f.name)}</a></div>`}).join("")}
if(t=="settings"){const{data}=await sb.from("settings").select("*");v.innerHTML="<h3>Settings</h3>"+(data||[]).map(s=>`<div class=c><b>${esc(s.key)}</b><input id="s_${esc(s.key)}" value="${esc(s.value)}"><button onclick="ss('${esc(s.key)}')">Save</button></div>`).join("")+`<div class=c><input id=sk placeholder="key (e.g. whatsapp)"><input id=sv placeholder="value"><button onclick="ss($('sk').value,$('sv').value)">Add</button></div>`}}
async function st(id,s){await sb.from("leads").update({status:s}).eq("id",id)}
async function sc(k){const g=$("g_"+k),e=$("e_"+k);await sb.from("site_content").upsert({key:k,value_gu:g?g.value:"",value_en:e?e.value:""});tab("content")}
async function ss(k,v){await sb.from("settings").upsert({key:k,value:v??$("s_"+k).value});tab("settings")}
async function up(){const f=$("fi").files[0];if(!f)return;const{error}=await sb.storage.from("images").upload(Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_"),f);error?alert(error.message):tab("images")}
init()</script></body></html>
